# =============================================================================
# PANNELLO DI GESTIONE — Immagine & Bellezza (Decap CMS)
# Ogni sezione qui sotto corrisponde a un file in /content.
# Ogni volta che si preme "Pubblica", la modifica viene salvata su GitHub e
# Vercel ripubblica il sito da solo in circa un minuto.
# =============================================================================

backend:
  name: github
  repo: AndreaCoffaro/immagine-bellezza
  branch: main
  # login con GitHub tramite le funzioni del sito su Vercel (api/auth.js e api/callback.js).
  # Richiede una OAuth App su GitHub con callback https://www.immaginebellezzamantio.it/api/callback
  # e le variabili GITHUB_CLIENT_ID e GITHUB_CLIENT_SECRET nelle impostazioni del progetto su Vercel.
  base_url: https://www.immaginebellezzamantio.it
  auth_endpoint: api/auth
  commit_messages:
    create: "Crea {{collection}} «{{slug}}»"
    update: "Aggiorna {{collection}} «{{slug}}»"
    delete: "Elimina {{collection}} «{{slug}}»"
    uploadMedia: "Carica foto «{{path}}»"
    deleteMedia: "Elimina foto «{{path}}»"

# Modalità prova sul Mac: su localhost il pannello salva nei file locali tramite anteprima.py
# (online questa riga viene ignorata e si usa il login GitHub)
local_backend:
  url: http://localhost:8000/api/v1

locale: it
site_url: https://www.immaginebellezzamantio.it
display_url: https://www.immaginebellezzamantio.it
logo_url: /images/web/logo.png
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: sito
    label: "Contenuti del sito"
    editor: { preview: false }
    extension: json
    format: json
    files:

      # ------------------------------------------------------------------ LISTINO
      - name: listino
        label: "Listino e prezzi"
        file: content/listino.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string }
          - { label: "Testo introduttivo", name: testo, widget: text }
          - label: "Categorie"
            name: categorie
            widget: list
            collapsed: true
            summary: "{{fields.categoria}}"
            label_singular: "categoria"
            hint: "Trascina per cambiare l'ordine delle schede"
            fields:
              - { label: "Nome categoria", name: categoria, widget: string }
              - { label: "Descrizione", name: descrizione, widget: text, required: false }
              - label: "Trattamenti"
                name: servizi
                widget: list
                collapsed: true
                label_singular: "trattamento"
                summary: "{{fields.nome}} — {{fields.prezzo}}"
                fields:
                  - { label: "Nome del trattamento", name: nome, widget: string }
                  - { label: "Prezzo", name: prezzo, widget: string, hint: "es. € 30,00 oppure «da € 30»" }

      # ------------------------------------------------------------------ SPA
      - name: spa
        label: "Area SPA"
        file: content/spa.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string, hint: &titolo-hint "Metti tra asterischi le parole da evidenziare in corsivo colorato, es. scrivendo  Festeggia \\*in SPA\\*  le parole «in SPA» diventano in corsivo" }
          - { label: "Testo", name: testo, widget: text }
          - label: "Cosa trovi nella SPA"
            name: caratteristiche
            widget: list
            collapsed: true
            label_singular: "elemento"
            summary: "{{fields.titolo}}"
            fields:
              - &icona
                label: Icona
                name: icona
                widget: select
                options:
                  - { label: "Sauna", value: sauna }
                  - { label: "Bagno turco (vapore)", value: steam }
                  - { label: "Idromassaggio (onde)", value: wave }
                  - { label: "Fiore di loto (massaggi, relax)", value: lotus }
                  - { label: "Foglia (prodotti naturali)", value: leaf }
                  - { label: "Scudo (igiene, sicurezza)", value: shield }
                  - { label: "Cuore", value: heart }
                  - { label: "WhatsApp", value: whatsapp }
                  - { label: "Calice (aperitivo)", value: glass }
                  - { label: "Candela (atmosfera)", value: candle }
                  - { label: "Persone (gruppi)", value: users }
                  - { label: "Regalo", value: gift }
                  - { label: "Stella", value: star }
              - { label: "Titolo", name: titolo, widget: string }
              - { label: "Testo", name: testo, widget: string }
          - label: "Foto (mosaico che si alterna)"
            name: foto
            widget: list
            collapsed: true
            label_singular: "foto"
            summary: "{{fields.alt}}"
            hint: "Le prime 4 compaiono subito, poi si alternano tutte"
            fields: &foto-campi
              - { label: "Foto", name: src, widget: image, choose_url: false }
              - { label: "Descrizione della foto", name: alt, widget: string, required: false,
                  hint: "Breve descrizione di cosa si vede (serve a Google e a chi usa lettori vocali)" }
              - label: "Inquadratura"
                name: pos
                widget: select
                required: false
                hint: "Se nel riquadro si vede la parte sbagliata della foto (es. teste tagliate), scegli dove centrarla"
                options:
                  - { label: "Centro", value: "center" }
                  - { label: "In alto", value: "center top" }
                  - { label: "In basso", value: "center bottom" }
                  - { label: "A sinistra", value: "left center" }
                  - { label: "A destra", value: "right center" }
          - label: "Percorsi e prezzi"
            name: percorsi
            widget: list
            collapsed: true
            label_singular: "percorso"
            summary: "{{fields.nome}} — {{fields.prezzo}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Descrizione", name: descrizione, widget: string }
              - { label: "Cosa comprende", name: include, widget: list, field: { label: "Voce", name: voce, widget: string } }
              - { label: "Prezzo", name: prezzo, widget: string, hint: "es. € 40" }
              - { label: "Nota sotto il prezzo", name: nota, widget: string, required: false, hint: "es. a persona" }
              - { label: "Metti in evidenza (card colorata)", name: evidenza, widget: boolean, default: false }
              - { label: "Etichetta in alto", name: etichetta, widget: string, required: false, hint: "es. Il più scelto — lascia vuoto per non mostrarla" }
          - { label: "Nota in fondo alla sezione", name: nota, widget: text, required: false }

      # ------------------------------------------------------------------ PROMOZIONI
      - name: promozioni
        label: "Promozioni"
        file: content/promozioni.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string }
          - label: "Promozioni attive"
            name: promozioni
            widget: list
            collapsed: true
            label_singular: "promozione"
            summary: "{{fields.titolo}} — {{fields.prezzo_scontato}}"
            hint: "Se elimini tutte le promozioni, la sezione sparisce dal sito"
            fields:
              - { label: "Titolo", name: titolo, widget: string }
              - { label: "Descrizione", name: descrizione, widget: string }
              - { label: "Prezzo pieno (barrato)", name: prezzo_pieno, widget: string, required: false, hint: "es. 100 — lascia vuoto se non c'è" }
              - { label: "Prezzo in promozione", name: prezzo_scontato, widget: string, hint: "es. 80" }
              - { label: "Etichetta", name: etichetta, widget: string, required: false, hint: "es. -20% oppure Offerta limitata" }

      # ------------------------------------------------------------------ HOME
      - name: home
        label: "Pagina iniziale"
        file: content/home.json
        fields:
          - label: "Parte alta"
            name: hero
            widget: object
            fields:
              - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
              - { label: "Titolo principale", name: titolo, widget: string, hint: *titolo-hint }
              - { label: "Testo", name: testo, widget: text }
              - { label: "Testo del pulsante", name: pulsante, widget: string }
              - { label: "Messaggio WhatsApp precompilato", name: messaggio_whatsapp, widget: string }
              - label: "Punti sotto il testo"
                name: punti
                widget: list
                collapsed: true
                label_singular: "punto"
                summary: "{{fields.testo}}"
                fields:
                  - *icona
                  - { label: "Testo", name: testo, widget: string }
          - label: "Foto che si alternano nell'arco"
            name: foto
            widget: list
            collapsed: true
            label_singular: "foto"
            summary: "{{fields.alt}}"
            hint: "Meglio foto verticali"
            fields: *foto-campi
          - label: "Scritte del bollino sotto le foto"
            name: bollino_testi
            widget: list
            field: { label: "Scritta", name: testo, widget: string }
            hint: "Il riquadro bianco sotto le foto in alto mostra queste scritte una dopo l'altra. Elimina tutte le scritte per non mostrarlo"
          - label: "Punti di forza (sotto la parte alta)"
            name: punti_di_forza
            widget: list
            collapsed: true
            label_singular: "punto"
            summary: "{{fields.titolo}}"
            fields:
              - *icona
              - { label: "Titolo", name: titolo, widget: string }
              - { label: "Testo", name: testo, widget: string }
          - label: "Riquadro finale (prima dei contatti)"
            name: chiusura
            widget: object
            fields:
              - { label: "Titolo", name: titolo, widget: string, hint: *titolo-hint }
              - { label: "Testo", name: testo, widget: text }

      # ------------------------------------------------------------------ EVENTI
      - name: eventi
        label: "Feste ed eventi"
        file: content/eventi.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string, hint: *titolo-hint }
          - { label: "Testo", name: testo, widget: text }
          - { label: "Occasioni", name: occasioni, widget: list, field: { label: "Occasione", name: occasione, widget: string } }
          - label: "Cosa comprende"
            name: punti
            widget: list
            collapsed: true
            label_singular: "punto"
            summary: "{{fields.titolo}}"
            fields:
              - *icona
              - { label: "Titolo", name: titolo, widget: string }
              - { label: "Testo", name: testo, widget: string }
          - { label: "Testo del pulsante", name: pulsante, widget: string }
          - { label: "Messaggio WhatsApp precompilato", name: messaggio_whatsapp, widget: string }
          - { label: "Nota accanto al pulsante", name: nota, widget: string, required: false }
          - { label: "Foto", name: foto, widget: object, fields: *foto-campi }

      # ------------------------------------------------------------------ REGALO
      - name: regalo
        label: "Buoni regalo"
        file: content/regalo.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string, hint: *titolo-hint }
          - { label: "Testo", name: testo, widget: text }
          - { label: "Punti elenco", name: punti, widget: list, field: { label: "Punto", name: punto, widget: string } }
          - { label: "Testo del pulsante", name: pulsante, widget: string }
          - { label: "Messaggio WhatsApp precompilato", name: messaggio_whatsapp, widget: string }
          - label: "Foto che si alternano"
            name: foto
            widget: list
            collapsed: true
            label_singular: "foto"
            summary: "{{fields.alt}}"
            fields: *foto-campi

      # ------------------------------------------------------------------ GALLERIA
      - name: galleria
        label: "Foto e ambienti"
        file: content/galleria.json
        fields:
          - label: "Schede apparecchiature e prodotti"
            name: tecnologie
            widget: list
            collapsed: true
            label_singular: "scheda"
            summary: "{{fields.nome}}"
            hint: "Una scheda per ogni macchinario o linea di prodotti. «Aggiungi scheda» per crearne una nuova, ✕ per eliminarla, trascina le lineette ═ per cambiare l'ordine"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Tipo di trattamento", name: categoria, widget: string, required: false, hint: "Scritta piccola sopra il nome, es. Epilazione" }
              - { label: "Foto", name: foto, widget: object, fields: *foto-campi }
              - { label: "Come funziona", name: descrizione, widget: text }
              - { label: "Benefici", name: benefici, widget: list, field: { label: "Beneficio", name: beneficio, widget: string } }
          - { label: "Schede — scritta piccola sopra il titolo", name: tecnologie_eyebrow, widget: string }
          - { label: "Schede — titolo", name: tecnologie_titolo, widget: string, hint: *titolo-hint }
          - { label: "Schede — testo introduttivo", name: tecnologie_testo, widget: text }
          - label: "Foto degli ambienti (esterno, accoglienza, cabine, SPA)"
            name: foto
            widget: list
            collapsed: true
            label_singular: "foto"
            summary: "{{fields.nome}}"
            hint: "Trascina le lineette ═ per cambiare l'ordine. Sul cellulare le foto si scorrono in quest'ordine, la prima è quella che si vede subito"
            fields:
              - { label: "Nome dell'ambiente", name: nome, widget: string, hint: "Compare sulla foto, es. Sala d'attesa, Cabina laser" }
              - label: "Zona"
                name: zona
                widget: select
                hint: "Serve per i pulsanti Accoglienza / Cabine / SPA sopra le foto"
                options:
                  - { label: "Accoglienza (esterno, ingresso, sala d'attesa)", value: "accoglienza" }
                  - { label: "Cabine (trattamenti, manicure e pedicure)", value: "cabine" }
                  - { label: "SPA", value: "spa" }
              - { label: "Foto", name: src, widget: image, choose_url: false }
              - { label: "In evidenza", name: evidenza, widget: boolean, default: false, required: false,
                  hint: "Attivalo per mostrare la foto in un riquadro grande sopra le altre, sempre intera (adatto ai collage di più foto), con testo e pulsante WhatsApp" }
              - { label: "Testo (solo per le foto in evidenza)", name: testo, widget: text, required: false }
              - { label: "Descrizione della foto", name: alt, widget: string, required: false,
                  hint: "Breve descrizione di cosa si vede (serve a Google e a chi usa lettori vocali)" }
              - label: "Inquadratura sul cellulare"
                name: pos
                widget: select
                required: false
                hint: "Sul cellulare le foto sono ritagliate in verticale: se si vede la parte sbagliata, scegli dove centrarla"
                options:
                  - { label: "Centro", value: "center" }
                  - { label: "In alto", value: "center top" }
                  - { label: "In basso", value: "center bottom" }
                  - { label: "A sinistra", value: "left center" }
                  - { label: "A destra", value: "right center" }
          - { label: "Foto degli ambienti — scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Foto degli ambienti — titolo", name: titolo, widget: string, hint: *titolo-hint }
          - { label: "Foto degli ambienti — testo", name: testo, widget: text }

      # ------------------------------------------------------------------ CHI SIAMO
      - name: chi-siamo
        label: "Chi siamo"
        file: content/chi-siamo.json
        fields:
          - { label: "Mostra la sezione sul sito", name: visibile, widget: boolean, default: false, hint: "Togli la spunta per nascondere tutta la sezione (i testi e le foto restano salvati)" }
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string, hint: *titolo-hint }
          - { label: "Testo", name: testo, widget: text, hint: "Lascia una riga vuota per iniziare un nuovo paragrafo" }
          - { label: "Firma", name: firma, widget: string }
          - { label: "Foto grande", name: foto_grande, widget: object, fields: *foto-campi }
          - { label: "Foto piccola (tonda)", name: foto_piccola, widget: object, fields: *foto-campi }

      # ------------------------------------------------------------------ RECENSIONI
      - name: recensioni
        label: "Recensioni"
        file: content/recensioni.json
        fields:
          - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string }
          - { label: "Titolo", name: titolo, widget: string }
          - label: "Recensioni"
            name: recensioni
            widget: list
            collapsed: true
            label_singular: "recensione"
            summary: "{{fields.nome}}"
            hint: "Inserisci solo recensioni reali (es. copiate da Google). Se l'elenco è vuoto la sezione non compare"
            fields:
              - { label: "Testo", name: testo, widget: text }
              - { label: "Nome (es. Giulia R.)", name: nome, widget: string }
              - { label: "Stelle", name: stelle, widget: number, value_type: int, min: 1, max: 5, default: 5 }

      # ------------------------------------------------------------------ CONTATTI
      - name: contatti
        label: "Contatti e orari"
        file: content/contatti.json
        fields:
          - { label: "Nome del centro", name: nome_centro, widget: string }
          - { label: "Telefono", name: telefono, widget: string, hint: "es. +39 347 009 6504" }
          - { label: "Numero WhatsApp", name: whatsapp, widget: string, hint: "Il numero a cui arrivano le prenotazioni, con +39" }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "Via e numero civico", name: indirizzo, widget: string, required: false }
          - { label: "CAP", name: cap, widget: string }
          - { label: "Città", name: citta, widget: string }
          - { label: "Provincia (sigla)", name: provincia, widget: string }
          - label: "Mappa Google"
            name: mappa_embed
            widget: text
            required: false
            hint: "Facoltativo: la mappa si crea da sola dall'indirizzo. Se preferisci quella della scheda Google: Google Maps → Condividi → Incorpora una mappa → Copia HTML, e incollalo qui"
          - { label: "Link Instagram", name: instagram, widget: string, required: false }
          - { label: "Link Facebook", name: facebook, widget: string, required: false }
          - { label: "Partita IVA", name: partita_iva, widget: string, required: false }
          - { label: "Link Privacy Policy", name: privacy, widget: string, required: false }
          - { label: "Link Cookie Policy", name: cookie, widget: string, required: false }
          - label: "Orari di apertura"
            name: orari
            widget: object
            hint: "Per un giorno di chiusura togli la spunta «Aperto»"
            fields:
              - label: "Lunedì"
                name: lunedi
                widget: object
                collapsed: true
                fields: &orario
                  - { label: "Aperto", name: aperto, widget: boolean, default: true }
                  - { label: "Apertura", name: dalle, widget: string, required: false, hint: "es. 09:00",
                      pattern: ['^$|^([01]\d|2[0-3]):[0-5]\d$', "Scrivi l'orario come 09:00"] }
                  - { label: "Chiusura", name: alle, widget: string, required: false, hint: "es. 19:00",
                      pattern: ['^$|^([01]\d|2[0-3]):[0-5]\d$', "Scrivi l'orario come 19:00"] }
                  - { label: "Riapertura pomeriggio (solo se c'è la pausa pranzo)", name: dalle_2, widget: string, required: false,
                      pattern: ['^$|^([01]\d|2[0-3]):[0-5]\d$', "Scrivi l'orario come 15:30"] }
                  - { label: "Chiusura pomeriggio", name: alle_2, widget: string, required: false,
                      pattern: ['^$|^([01]\d|2[0-3]):[0-5]\d$', "Scrivi l'orario come 19:30"] }
              - { label: "Martedì", name: martedi, widget: object, collapsed: true, fields: *orario }
              - { label: "Mercoledì", name: mercoledi, widget: object, collapsed: true, fields: *orario }
              - { label: "Giovedì", name: giovedi, widget: object, collapsed: true, fields: *orario }
              - { label: "Venerdì", name: venerdi, widget: object, collapsed: true, fields: *orario }
              - { label: "Sabato", name: sabato, widget: object, collapsed: true, fields: *orario }
              - { label: "Domenica", name: domenica, widget: object, collapsed: true, fields: *orario }

  # ==================================================================== PAGINE DEI TRATTAMENTI
  # Ogni pagina diventa https://www.immaginebellezzamantio.it/trattamenti/<nome-della-pagina>/
  - name: trattamenti
    label: "Pagine dei trattamenti"
    label_singular: "pagina"
    description: "Una pagina per ogni trattamento importante: è quella che Google mostra a chi cerca, ad esempio, «trucco sposa Mussomeli». Testi originali e prudenti: niente promesse di risultati."
    folder: content/trattamenti
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: nome
    slug: "{{slug}}"
    summary: "{{nome}}"
    sortable_fields: [ordine, nome]
    editor: { preview: false }
    fields:
      - { label: "Nome breve", name: nome, widget: string, hint: "es. Trucco sposa — usato nei link e nelle schede. L'indirizzo della pagina nasce da qui e non cambia più" }
      - { label: "Pubblicata", name: pubblicata, widget: boolean, default: true, hint: "Togli la spunta per nascondere la pagina dal sito" }
      - { label: "Ordine", name: ordine, widget: number, value_type: int, default: 10, hint: "Ordine nell'elenco dei trattamenti (1 = primo)" }
      - { label: "Titolo per Google", name: titolo_seo, widget: string, hint: "Il titolo blu nei risultati di Google, max ~60 caratteri. Es. Trucco Sposa a Mussomeli | Immagine & Bellezza" }
      - { label: "Descrizione per Google", name: descrizione_seo, widget: text, hint: "Il testo grigio sotto il titolo su Google, 140-160 caratteri" }
      - { label: "Scritta piccola sopra il titolo", name: eyebrow, widget: string, required: false, hint: "es. Make-up · Mussomeli" }
      - { label: "Titolo della pagina", name: h1, widget: string, hint: "Servizio + città, es. Trucco sposa a Mussomeli" }
      - { label: "Introduzione", name: intro, widget: text }
      - { label: "Foto principale", name: foto, widget: object, fields: *foto-campi }
      - label: "Sezioni del testo"
        name: sezioni
        widget: list
        collapsed: true
        label_singular: "sezione"
        summary: "{{fields.titolo}}"
        fields:
          - { label: "Titolo della sezione", name: titolo, widget: string }
          - { label: "Testo", name: testo, widget: text, hint: &testo-hint "Riga vuota = nuovo paragrafo. Righe che iniziano con «- » = elenco puntato. **parola** = grassetto. [testo](/trattamenti/spa/) = link" }
      - label: "Prezzi da mostrare (categorie del listino)"
        name: categorie_listino
        widget: list
        required: false
        field: { label: "Categoria", name: categoria, widget: string }
        hint: "Scrivi il nome esatto della categoria del listino, es. Trattamento viso. I prezzi vengono presi dal listino e si aggiornano da soli"
      - { label: "Mostra i prezzi dei percorsi SPA", name: prezzi_spa, widget: boolean, default: false, required: false }
      - label: "Domande frequenti"
        name: faq
        widget: list
        collapsed: true
        required: false
        label_singular: "domanda"
        summary: "{{fields.domanda}}"
        hint: "Attenzione: se nelle risposte scrivi dei prezzi, aggiornali anche qui quando cambi il listino"
        fields:
          - { label: "Domanda", name: domanda, widget: string }
          - { label: "Risposta", name: risposta, widget: text }
      - { label: "Trattamenti correlati", name: correlati, widget: relation, collection: trattamenti, value_field: "{{slug}}", search_fields: [nome], display_fields: [nome], multiple: true, required: false }
      - { label: "Messaggio WhatsApp precompilato", name: messaggio_whatsapp, widget: string, required: false }

  # ==================================================================== BLOG
  # Ogni articolo diventa https://www.immaginebellezzamantio.it/blog/<titolo-articolo>/
  - name: blog
    label: "Blog e consigli"
    label_singular: "articolo"
    description: "Articoli utili collegati ai trattamenti. Linguaggio prudente: niente promesse mediche o di risultati."
    folder: content/blog
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titolo
    slug: "{{slug}}"
    summary: "{{titolo}} ({{data}})"
    sortable_fields: [data, titolo]
    editor: { preview: false }
    fields:
      - { label: "Titolo", name: titolo, widget: string }
      - { label: "Pubblicato", name: pubblicato, widget: boolean, default: true }
      - { label: "Data", name: data, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Titolo per Google", name: titolo_seo, widget: string, required: false }
      - { label: "Descrizione per Google", name: descrizione_seo, widget: text, hint: "140-160 caratteri" }
      - { label: "Riassunto (nelle schede)", name: sommario, widget: text }
      - { label: "Foto", name: foto, widget: object, fields: *foto-campi }
      - { label: "Testo", name: testo, widget: text, hint: "Riga vuota = nuovo paragrafo. «## Titolo» = sottotitolo. Righe che iniziano con «- » = elenco. **parola** = grassetto. [testo](/trattamenti/spa/) = link" }
      - { label: "Trattamenti collegati", name: correlati, widget: relation, collection: trattamenti, value_field: "{{slug}}", search_fields: [nome], display_fields: [nome], multiple: true, required: false }
