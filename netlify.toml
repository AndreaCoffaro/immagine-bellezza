# Configurazione per Netlify (hosting del sito)
[build]
  publish = "."
  # scrive testi, prezzi, orari e foto direttamente nella pagina (per Google): vedi prerender.py.
  # Se non riuscisse, il sito viene pubblicato lo stesso.
  command = "python3 prerender.py || echo 'prerender saltato'"

# I contenuti e il pannello non devono restare in cache: le modifiche si vedono subito
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Le foto cambiano di rado: il browser le tiene per 7 giorni (pagine più veloci per chi torna)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

# Il vecchio indirizzo provvisorio porta al dominio vero (Google tiene una sola versione del sito)
[[redirects]]
  from = "https://immaginebellezza.netlify.app/*"
  to = "https://immaginebellezzamantio.it/:splat"
  status = 301
  force = true
